<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b87"><link rel="manifest" href="manifest.json"><title>Loan Tracker</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f3f7f9;color:#17313b}.app{max-width:520px;margin:auto;padding:20px}.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 14px #0001}h1{margin:0 0 5px;color:#176b87}.sub{color:#71818a}.total{font-size:30px;font-weight:700;margin-top:8px}.month{display:flex;align-items:center;justify-content:space-between;padding:14px;border-radius:12px;margin:8px 0;background:#f7f9fa}.paid{background:#dff3e5}.amount{font-weight:700}.btn{border:0;border-radius:10px;padding:11px 15px;background:#176b87;color:white;font-weight:700}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd7dc;border-radius:10px;margin:7px 0 12px;font-size:16px}small{color:#667780}</style></head><body><main class="app"><div class="card"><h1>Loan Tracker</h1><div class="sub">Track your monthly payments</div><div class="total" id="total">Rs. 0</div><small>Total Paid</small></div><div class="card"><h3>Add / Update Payment</h3><label>Month</label><select id="month" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccd7dc;font-size:16px"></select><label>Amount (Rs.)</label><input id="amount" type="number" inputmode="numeric" placeholder="Enter paid amount"><button class="btn" onclick="savePayment()">Save Payment</button></div><div class="card"><h3>Monthly Payments</h3><div id="list"></div></div></main><script>const months=['January','February','March','April','May','June','July','August','September','October','November','December'];const defaults=[0,0,0,0,0,0,23242,30036,29810,29167,0,0];let data=JSON.parse(localStorage.getItem('loanTracker')||'null')||defaults.slice();const sel=document.getElementById('month');months.forEach((m,i)=>{let o=document.createElement('option');o.value=i;o.textContent=m;sel.appendChild(o)});function money(n){return 'Rs. '+Number(n||0).toLocaleString('en-LK')}function render(){document.getElementById('total').textContent=money(data.reduce((a,b)=>a+Number(b||0),0));document.getElementById('list').innerHTML=months.map((m,i)=>`<div class="month ${data[i]>0?'paid':''}"><span>${m}</span><span class="amount">${data[i]>0?money(data[i]):'Not paid'}</span></div>`).join('')}function savePayment(){let i=Number(sel.value),v=Number(document.getElementById('amount').value);if(v<=0){alert('Please enter a valid amount.');return}data[i]=v;localStorage.setItem('loanTracker',JSON.stringify(data));document.getElementById('amount').value='';render();alert('Payment saved.')}render();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
